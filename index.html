<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211527">
<title>ChurchFantasie — 48 hours together</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#211527;--panel:#2c1d33;--pink:#ff96c1;--cream:#fff1dc;--muted:#cbb8ca;--line:#ffffff22;--gold:#ffd28a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.serif{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.brand{font-size:12px;font-weight:700;letter-spacing:2px}
.badge{font-size:10px;letter-spacing:1px;border:1px solid #ff96c160;padding:7px 11px;border-radius:30px;color:var(--pink)}
main{max-width:560px;margin:auto;padding:22px 18px}
.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--pink)}
h1{font-family:Georgia,serif;font-weight:400;font-size:52px;line-height:1.02;letter-spacing:-2px;margin:16px 0}
h1 em{color:var(--pink)}
h2{font-family:Georgia,serif;font-weight:400;font-size:30px;line-height:1.15;margin:8px 0 14px}
h3{margin:0 0 6px;font-size:16px}
.lead{font-size:16px;line-height:1.6;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions>*{flex:1 1 140px}
.primary,.secondary,.ghost{padding:15px 18px;border-radius:10px;border:1px solid var(--pink);background:var(--pink);color:#29152b;font-weight:700;font-size:15px}
.secondary{background:transparent;color:var(--cream);border-color:#ffffff40}
.ghost{background:transparent;border:0;color:var(--muted);font-weight:400;padding:10px}
button:disabled{opacity:.5}
.card{border:1px solid var(--line);background:#ffffff06;border-radius:14px;padding:16px;margin-top:14px}
.row{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#4a2c48;display:grid;place-items:center;font-family:Georgia,serif;font-size:22px;color:var(--pink);flex:none;overflow:hidden}
.avatar.big{width:96px;height:96px;font-size:40px}
label{display:block;font-size:13px;color:var(--muted);margin:16px 0 7px}
input,select,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #ffffff40;background:#1a1020;color:var(--cream)}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;line-height:1.5;color:var(--cream);font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--pink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chapel{display:grid;place-items:center;margin:8px 0 4px}
.arch{border:2px solid var(--pink);box-shadow:0 0 18px #ff83b333,inset 0 0 18px #ff83b322;width:220px;height:290px;border-radius:120px 120px 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;background:radial-gradient(ellipse at center,#70384b55,transparent 70%)}
.arch:before{content:'';position:absolute;inset:10px;border:1px solid #ff96c160;border-radius:110px 110px 5px 5px}
.arch small{letter-spacing:3px;font-size:9px;margin:14px 0}
.rings{font-size:52px;line-height:1.2;color:var(--gold)}
.neon{font-family:Georgia,serif;font-size:30px;font-style:italic;color:#ffbfdb;text-shadow:0 0 22px #ff669f;line-height:1.05}
.timer{font-size:40px;font-family:Georgia,serif;color:var(--pink);margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.status{color:var(--pink);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid #ff96c160;color:var(--pink);margin-top:8px}
.certificate{background:#fff3e4;color:#39243f;text-align:center;padding:26px 20px;border:1px solid #ddb7b3;outline:1px solid #b27b87;outline-offset:-10px;border-radius:3px;margin:16px 0}
.certificate .label{font-size:9px;letter-spacing:3px}
.certificate h3{font-family:Georgia,serif;font-size:28px;font-weight:400;margin:16px 0 8px}
.certificate .names{font-family:Georgia,serif;font-size:26px;color:#9c4967;margin:18px 0;overflow-wrap:anywhere}
.certificate p{font-size:12px;line-height:1.7;margin:6px 0}
.certificate .seal{margin:12px auto;font-size:30px;color:#a6657b}
.profile-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.profile-card .photo{height:300px;background:linear-gradient(160deg,#5a2f4f,#211527);display:grid;place-items:center;font-family:Georgia,serif;font-size:96px;color:var(--pink)}
.profile-card .photo img{width:100%;height:100%;object-fit:cover}
.profile-card .body{padding:16px}
.swipe{display:flex;gap:12px;margin-top:14px}
.swipe button{flex:1;padding:16px;font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#1a1020f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:4}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:12px 4px 14px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:20px;font-weight:400;line-height:1}
nav button.on{color:var(--pink)}
.dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#29152b;font-size:11px;font-weight:700;line-height:18px;padding:0 5px;margin-left:6px}
.overlay{position:fixed;inset:0;background:#100b16e6;backdrop-filter:blur(10px);z-index:10;overflow:auto;padding:24px 16px;display:flex;align-items:flex-start;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--panel);border:1px solid #ffffff25;border-radius:20px;padding:22px;margin-top:6vh}
.hidden{display:none!important}
.vow-opt{display:block;width:100%;text-align:left;background:#1a1020;border:1px solid #ffffff30;color:var(--cream);padding:14px;border-radius:10px;margin-top:10px;font-family:Georgia,serif;font-size:16px;font-style:italic}
.vow-opt.on{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.error{color:#ffb1a4;font-size:13px;min-height:18px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--cream);color:#29152b;padding:11px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.center{text-align:center}
.spin{width:34px;height:34px;border:3px solid #ff96c140;border-top-color:var(--pink);border-radius:50%;animation:s 1s linear infinite;margin:30vh auto 0}
@keyframes s{to{transform:rotate(360deg)}}
.steps .row{align-items:flex-start;margin-top:14px}
.num{color:var(--pink);font-family:Georgia,serif;font-size:24px;width:34px;flex:none}
.steps p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 10px;background:#ffffff06}
.stat b{display:block;font-family:Georgia,serif;font-size:26px;font-weight:400;color:var(--pink)}
.stat span{font-size:11px;color:var(--muted)}
.visitors{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.visitor{display:flex;align-items:center;gap:10px;font-size:14px}
.visitor .avatar{width:32px;height:32px;font-size:15px}
.seg{display:flex;gap:6px;margin-top:16px;overflow-x:auto}
.seg button{flex:none;background:transparent;border:1px solid #ffffff30;color:var(--muted);padding:8px 12px;border-radius:20px;font-size:13px}
.seg button.on{border-color:var(--pink);color:var(--pink)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid #ffffff30;color:var(--muted);margin:4px 4px 0 0}
.tag.pink{border-color:#ff96c180;color:var(--pink)}
.live{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin:12px 0 4px;font-size:13px;color:var(--muted)}
.live b{color:var(--cream);font-weight:600}
.live .dotl{display:inline-flex;align-items:center;gap:6px}
.pulse{width:8px;height:8px;border-radius:50%;background:#6ee7a0;box-shadow:0 0 0 0 #6ee7a088;animation:pl 2s infinite}
.certificate.gold{background:linear-gradient(160deg,#fff6d8,#f3d58c 55%,#e9c06a);border-color:#c99a3b;outline-color:#a77a22}
.certificate.gold .names,.certificate.gold .seal{color:#8a5a12}
.vip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:10px;background:linear-gradient(90deg,#ffd28a,#ff96c1);color:#29152b;vertical-align:middle;margin-left:6px}
.star{color:#ffd28a}
.paid{border-color:#ffd28a66;background:linear-gradient(160deg,#ffd28a14,#ff96c10a)}
.blur{filter:blur(6px)}
.likes-row{display:flex;gap:-8px;margin:10px 0}
.likes-row .avatar{width:40px;height:40px;margin-right:-10px;border:2px solid var(--panel)}
.perks{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.8}
@keyframes pl{0%{box-shadow:0 0 0 0 #6ee7a088}70%{box-shadow:0 0 0 8px #6ee7a000}100%{box-shadow:0 0 0 0 #6ee7a000}}
</style>
</head>
<body>
<header><div class="brand">CHURCHFANTASIE ✦</div><span class="badge">CHAPEL / 48H</span></header>
<main id="app"><div class="spin"></div></main>
<nav id="nav" class="hidden">
  <button data-tab="chapel"><b>⚭</b>Chapel<span id="navdot"></span></button>
  <button data-tab="discover"><b>♡</b>Find a match</button>
  <button data-tab="profile"><b>✦</b>Profile</button>
  <button data-tab="admin" id="navadmin" class="hidden"><b>♛</b>Admin</button>
</nav>
<div id="overlay" class="overlay hidden"><div class="sheet" id="sheet"></div></div>

<script>
(() => {
const CFG = window.CHAPEL_CONFIG || {};
const tg = window.Telegram && window.Telegram.WebApp;
const $ = s => document.querySelector(s);
const app = $('#app');
const VOWS = [
  'To be there for you. At least for these 48 hours.',
  'To share memes, in good times and bad.',
  'To never disappear without an explanation.'
];
const ERR = {
  not_configured: 'The chapel is not open yet — setup is still in progress.',
  open_in_telegram: 'Please open the chapel from Telegram.',
  bad_signature: 'We could not verify your Telegram session. Close and reopen the app.',
  session_expired: 'Your session has expired. Close and reopen the app.',
  adult_required: 'Please confirm that you are 18+ first.',
  name_required: 'Please enter your name.',
  age_invalid: 'You must be between 18 and 99.',
  profile_incomplete: 'Fill in your age, who you are and who you are looking for.',
  invalid_target: 'This person is no longer available.',
  vow_required: 'Choose or write a vow.',
  already_married: 'You are already married! One wedding at a time.',
  proposer_taken: 'Too late — they are already married to someone else.',
  not_a_match: 'You can propose only to a mutual match.',
  proposal_exists: 'There is already a proposal between you two.',
  not_found: 'This invitation does not exist.',
  no_longer_available: 'This invitation is no longer available.',
  own_proposal: 'This is your own invitation — send it to your person.',
  not_for_you: 'This proposal was meant for someone else.',
  not_married: 'You are not married right now.',
  not_admin: 'This page is only for the chapel owner.',
  renewal_is_free: 'This renewal is free — just say yes.',
  already_vip: 'You are already a Chapel VIP ✦',
  product_unavailable: 'This is not available right now.'
};

let S = null;          // server state
let tab = 'chapel';
let feed = [];
let likes = null;
let startParam = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param || new URLSearchParams(location.search).get('startapp');
let busy = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const haptic = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const tap = () => { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function fmtDate(t) { return new Date(t).toLocaleString('en-US', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'}); }
function left(until) {
  let s = Math.max(0, Math.floor((new Date(until) - Date.now()) / 1000));
  return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, '0')).join(' : ');
}
function avatar(photo, name, big) {
  const cls = 'avatar' + (big ? ' big' : '');
  const ini = esc((name || '?').trim().charAt(0).toUpperCase());
  return photo ? `<div class="${cls}"><img src="${esc(photo)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.textContent='${ini}'"></div>` : `<div class="${cls}">${ini}</div>`;
}
function ago(t) {
  const s = Math.max(0, (Date.now() - new Date(t)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return Math.floor(s / 86400) + ' d ago';
}
function askNotify(force) {
  try {
    if (!tg || !tg.requestWriteAccess || !tg.isVersionAtLeast('6.9')) return;
    let asked = false; try { asked = localStorage.getItem('cf_notify_asked') === '1'; } catch (e) {}
    if (asked && !force) return;
    tg.requestWriteAccess(ok => { try { localStorage.setItem('cf_notify_asked', '1'); } catch (e) {} if (force) toast(ok ? 'Notifications are on ♡' : 'Notifications stay off'); });
  } catch (e) {}
}
function botLink(param) { return `https://t.me/${CFG.BOT_USERNAME}${param ? '?startapp=' + encodeURIComponent(param) : ''}`; }

async function api(fn, args = {}) {
  const r = await fetch(`${CFG.SUPABASE_URL.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { 'apikey': CFG.SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ init_data: tg ? tg.initData : '', ...args })
  });
  const data = await r.json().catch(() => null);
  if (!r.ok) {
    const code = data && data.message || 'error';
    const e = new Error(ERR[code] || 'Something went wrong. Please try again.'); e.code = code; throw e;
  }
  return data;
}
async function act(fn, args, okMsg) {
  if (busy) return null; busy = true;
  try { const r = await api(fn, args); if (okMsg) { haptic('success'); toast(okMsg); } return r; }
  catch (e) { haptic('error'); toast(e.message); return null; }
  finally { busy = false; }
}
async function load() {
  const [st, c, shop] = await Promise.all([api('api_state', { start_param: startParam || null }), api('api_counts').catch(() => null), api('api_shop').catch(() => null)]);
  S = st; S.counts = c; S.shop = shop || { prices: {} };
  S.me.is_vip = !!S.shop.vip_until;
  updateNav();
}
const ppl = n => n + (n === 1 ? ' person' : ' people');
const price = code => (S && S.shop && S.shop.prices[code]) || '';
const hm = t => new Date(t).toLocaleString('en-US', {hour: '2-digit', minute: '2-digit'});
async function buy(product) {
  if (busy) return; busy = true;
  try {
    if (!tg || !tg.openInvoice) throw new Error('Please update Telegram to pay with Stars.');
    const r = await fetch(`${CFG.SUPABASE_URL.replace(/\/$/, '')}/functions/v1/tg`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'invoice', init_data: tg.initData, product }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.link) throw new Error(ERR[d.message] || 'Payments are unavailable right now. Please try again later.');
    tg.openInvoice(d.link, async status => {
      if (status === 'paid') {
        haptic('success'); toast('Payment received ✦');
        for (let i = 0; i < 3; i++) { await new Promise(res => setTimeout(res, 1500)); try { await load(); render(); } catch (e) {} }
      } else if (status === 'failed') toast('Payment failed — nothing was charged.');
    });
  } catch (e) { haptic('error'); toast(e.message); } finally { busy = false; }
}
function liveLine() {
  const c = S && S.counts; if (!c) return '';
  return `<div class="live"><span class="dotl"><span class="pulse"></span><b>${c.online}</b> online now</span>
    <span><b>${c.searching}</b> looking for a match</span><span><b>${ppl(c.users)}</b> in the chapel</span>${c.married ? `<span><b>${c.married}</b> married right now</span>` : ''}</div>`;
}

// ───────── overlay ─────────
function sheet(html) { $('#sheet').innerHTML = html; $('#overlay').classList.remove('hidden'); }
function closeSheet() { $('#overlay').classList.add('hidden'); }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });

// ───────── screens ─────────
function render() {
  if (!S) return;
  $('#nav').classList.toggle('hidden', !S.me.adult);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (!S.me.adult) return gate();
  if (S.invite && startParam) return inviteLanding();
  if (tab === 'discover') return discover();
  if (tab === 'profile') return profile();
  if (tab === 'admin' && S.me.is_admin) return admin();
  return chapel();
}

function updateNav() {
  const n = S ? S.incoming.length : 0;
  $('#navdot').innerHTML = n ? `<span class="dot">${n}</span>` : '';
  $('#navadmin').classList.toggle('hidden', !(S && S.me.is_admin));
}

function gate() {
  app.innerHTML = `
    <div class="eyebrow">Welcome to the chapel</div>
    <h1>Forever.<br><em>For 48 hours.</em></h1>
    <p class="lead">A little Vegas inside Telegram. Two yeses, one little wedding, and two whole days to write your story.</p>
    <div class="card">
      <label class="check"><input type="checkbox" id="g1"> I am 18 or older.</label>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="g2"> I understand this is just for fun and not legally binding. I will be kind to others.</label>
      <div class="error" id="gerr"></div>
      <div class="actions"><button class="primary" id="gok">Enter the chapel ⚭</button></div>
    </div>`;
  $('#gok').onclick = async () => {
    if (!$('#g1').checked || !$('#g2').checked) { $('#gerr').textContent = 'Please confirm both to continue.'; return; }
    if (await act('api_confirm_adult')) { askNotify(); await load(); render(); }
  };
}

function inviteLanding() {
  const inv = S.invite;
  const done = () => { startParam = null; render(); };
  if (inv.missing || inv.expired || inv.status !== 'pending') {
    app.innerHTML = `<div class="eyebrow">Invitation</div><h2>This invitation is no longer available.</h2>
      <p class="lead">${inv.status === 'accepted' ? 'Someone already said yes to it.' : 'It was cancelled or has expired.'}</p>
      <div class="actions"><button class="primary" id="go">Go to the chapel</button></div>`;
    $('#go').onclick = done; return;
  }
  if (inv.is_mine) {
    app.innerHTML = `<div class="eyebrow">Your invitation</div><h2>This is your own invitation.</h2>
      <p class="lead">Send it to your person — they need to say yes from their own Telegram.</p>
      <div class="actions"><button class="primary" id="share">Send invitation ↗</button><button class="secondary" id="go">Back</button></div>`;
    $('#share').onclick = () => shareInvite(inv.code, inv.vow); $('#go').onclick = done; return;
  }
  app.innerHTML = `
    <div class="eyebrow">You are invited</div>
    <div class="row" style="margin-top:16px">${avatar(inv.from_photo, inv.from_name)}<h2 style="margin:0">${esc(inv.from_name)} wants to marry you — for 48 hours.</h2></div>
    <div class="card center"><div class="note">Their vow</div><p class="serif" style="font-size:20px;font-style:italic;margin:8px 0">«${esc(inv.vow)}»</p></div>
    <p class="note">If you say yes, your little marriage starts right away and ends automatically in 48 hours — unless you both choose to renew.</p>
    <div class="actions"><button class="primary" id="yes">Say yes ⚭</button><button class="secondary" id="no">Not now</button></div>`;
  $('#yes').onclick = async () => {
    const r = await act('api_respond', { proposal_ref: inv.code, accept: true }, 'Just married! ⚭');
    if (r) { startParam = null; tab = 'chapel'; await load(); render(); showCertificate(); }
  };
  $('#no').onclick = done;
}

function chapel() {
  const m = S.marriage;
  let html = '';
  if (m) {
    html += marriageBlock(m);
  } else {
    html += `
      <div class="eyebrow">A little Vegas inside Telegram</div>
      <h1>Forever.<br><em>For 48 hours.</em></h1>
      <p class="lead">Invite your person. Or meet them here. Two yeses, one little wedding, and two whole days to write your story.</p>
      ${liveLine()}
      <div class="actions"><button class="primary" id="invite">Invite your person ↗</button><button class="secondary" id="find">Find a match ♡</button></div>`;
  }
  if (S.incoming.length) {
    html += `<hr><div class="eyebrow">Proposals for you</div>` + S.incoming.map(p => `
      <div class="card">
        <div class="row">${avatar(p.from_photo, p.from_name)}<div><h3>${esc(p.from_name)}${p.from_age ? ', ' + p.from_age : ''}</h3><div class="note">${esc(p.from_bio || '')}</div></div></div>
        <p class="serif" style="font-style:italic;font-size:17px">«${esc(p.vow)}»</p>

      <p class="lead">Create your chapel profile to see others and be seen. Only people you both like each other can propose.</p>

function showFeed() {

      <div>${u.came_via ? `<span class="tag pink">came via ${esc(u.came_via)}’s link</span>` : '<span class="tag">came directly</span>'}
      ${u.married_to ? `<span class="tag pink">⚭ married to ${esc(u.married_to)}</span>` : ''}
      ${u.weddings ? `<span class="tag">${u.weddings} wedding${u.weddings > 1 ? 's' : ''}</span>` : ''}
      ${u.gender ? `<span class="tag">${g[u.gender] || ''} → ${esc(u.looking_for || '')}</span>` : ''}
      ${u.discoverable ? '<span class="tag">in Find a match</span>' : ''}
      ${!u.adult ? '<span class="tag">hasn’t confirmed 18+</span>' : ''}
      ${u.reported ? `<span class="tag" style="color:#ffb1a4;border-color:#ffb1a480">reported ${u.reported}×</span>` : ''}</div></div></div>`).join('') || '<p class="note">No users yet.</p>';
  } else if (adminView === 'marriages') {
    list = A.marriages.map(m => { const live = !m.ended_at && new Date(m.expires_at) > Date.now();
      return `<div class="card"><h3>${esc(m.a)} &amp; ${esc(m.b)}</h3>
      <div class="note">«${esc(m.vow)}»</div>
      <div class="note">${live ? `<span class="status">ends in ${left(m.expires_at)}</span>` : (m.end_reason === 'expired' ? 'ended automatically' : 'divorced early') + ' · ' + fmtDate(m.ended_at)}
      · started ${fmtDate(m.started_at)}${m.renewals ? ' · renewed ' + m.renewals + '×' : ''}${live && (m.a_renew || m.b_renew) ? ' · one yes to renew' : ''}</div></div>`; }).join('') || '<p class="note">No weddings yet.</p>';
  } else if (adminView === 'money') {
    let M; try { M = await api('api_admin_money'); } catch (e) { M = null; }
    const names = { renewal: 'Renewal', boost: 'Boost', likes: 'Who liked you', vip: 'VIP' };
    list = M ? `<div class="stats">${tile(M.stars_total + ' ⭐', 'earned total')}${tile(M.stars_30d + ' ⭐', 'last 30 days')}${tile(M.vip_now, 'VIP now')}</div>` +
      (M.list.map(p => `<div class="card row" style="justify-content:space-between"><div><h3 style="margin:0">${esc(p.name)}</h3><div class="note">${names[p.product] || p.product}${p.recurring ? ' · auto-renewal' : ''} · ${ago(p.at)}</div></div><b class="star">${p.stars} ⭐</b></div>`).join('') || '<p class="note">No payments yet.</p>') +
      '<p class="note">Withdraw Stars: open @churshfinalfantasie_bot in Telegram → bot profile → Balance (via Fragment), or spend them on Telegram Ads.</p>' : '<p class="error">Could not load payments.</p>';
  } else {
    list = A.invites.map(i => `<div class="card"><h3>${esc(i.from)}’s invitation <span class="tag ${i.status === 'accepted' ? 'pink' : ''}">${i.status === 'accepted' ? 'accepted by ' + esc(i.accepted_by) : i.status}</span></h3>
      <div class="note">«${esc(i.vow)}» · sent ${ago(i.created_at)}</div>
      <div class="note">${i.visitors.length ? 'Opened by: ' + i.visitors.map(v => esc(v.name) + ' (' + ago(v.at) + ')').join(', ') : 'Nobody opened it yet'}</div></div>`).join('') || '<p class="note">No invitations yet.</p>';
  }
  app.innerHTML = `<div class="eyebrow">Chapel owner</div><h2>Who’s in the chapel</h2>
    <div class="stats">${tile(s.users, 'users')}${tile(s.new_today, 'new today')}${tile(s.active_today, 'active today')}
      ${tile(s.married_now, 'married now')}${tile(s.weddings_total, 'weddings')}${tile(s.renewals_total, 'renewals')}
      ${tile(s.invites_sent, 'invites sent')}${tile(s.invite_opens, 'link opens')}${tile(s.discoverable, 'in Find a match')}</div>
    <div class="seg"><button data-v="users" class="${adminView === 'users' ? 'on' : ''}">Users</button><button data-v="marriages" class="${adminView === 'marriages' ? 'on' : ''}">Weddings</button><button data-v="invites" class="${adminView === 'invites' ? 'on' : ''}">Invitations</button><button data-v="money" class="${adminView === 'money' ? 'on' : ''}">⭐ Money</button><button id="arefresh">↻</button></div>
    ${list}`;
  app.querySelectorAll('.seg [data-v]').forEach(b => b.onclick = () => { adminView = b.dataset.v; admin(); });
  $('#arefresh').onclick = () => admin();
}

// ───────── boot ─────────
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tap(); tab = b.dataset.tab; startParam = null; render(); window.scrollTo(0, 0); });

setInterval(() => {
  document.querySelectorAll('[data-until]').forEach(el => {
    el.textContent = left(el.dataset.until);
    if (new Date(el.dataset.until) <= Date.now() && !el.dataset.done) { el.dataset.done = 1; load().then(render).catch(() => {}); }
  });
}, 1000);
setInterval(() => { if (S && S.me.adult && tab === 'chapel' && $('#overlay').classList.contains('hidden')) load().then(render).catch(() => {}); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) load().then(render).catch(() => {}); });

async function boot() {
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#211527'); tg.setBackgroundColor('#211527'); if (tg.setBottomBarColor) tg.setBottomBarColor('#1a1020'); } catch (e) {}
  }
  if (!tg || !tg.initData) {
    app.innerHTML = `<div class="eyebrow">A little Vegas inside Telegram</div><h1>Forever.<br><em>For 48 hours.</em></h1>
      <p class="lead">The chapel lives inside Telegram.</p>
      <div class="actions"><a class="primary center" style="text-decoration:none" href="${botLink(startParam)}">Open in Telegram ⚭</a></div>`;
    return;
  }
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY) { app.innerHTML = `<h2>Almost there.</h2><p class="lead">${ERR.not_configured}</p>`; return; }
  try { await load(); render(); }
  catch (e) { app.innerHTML = `<h2>Hmm.</h2><p class="lead">${esc(e.message)}</p><div class="actions"><button class="primary" onclick="location.reload()">Try again</button></div>`; }
}
boot();
})();
</script>
</body>
</html>
